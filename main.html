<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GreenLeaf Haven | Premium Indoor Plants PH</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sticky-center-image" id="stickyPlantImg">
  <img src="https://cdn-icons-png.flaticon.com/512/1998/1998617.png" alt="scroll plant">
</div>

<header class="main-header">
  <div class="logo-area">
    <h2>🌿 GreenLeaf Haven</h2>
    <span>🇵🇭 ph • plant paradise</span>
  </div>
  <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search plants...">
    </div>
    <div class="nav-links">
      <button class="nav-btn" id="navLandingBtn"><i class="fas fa-home"></i> Home</button>
      <button class="nav-btn" id="navShopBtn"><i class="fas fa-seedling"></i> Shop</button>
      <div class="cart-icon-wrapper" id="cartIconHeader">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCountHeader">0</span>
      </div>
    </div>
  </div>
</header>

<main id="appRoot" class="container">
  <div id="viewContainer">Loading...</div>
</main>

<div id="checkoutModal" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-leaf"></i> Complete Your Order</h3>
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" id="buyerName" placeholder="Jane Pauline Arreglo">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="buyerEmail" placeholder="janepauline@gmail.com">
    </div>
    <div class="form-group">
      <label>Delivery Address *</label>
      <textarea id="buyerAddress" rows="2" placeholder="Street, Barangay, City, Province"></textarea>
    </div>
    <div class="form-group">
      <label>Contact Number</label>
      <input type="text" id="buyerPhone" placeholder="0917 123 4567">
    </div>
    <div class="form-group">
      <label>Select Payment Method</label>
      <div class="payment-option" id="paymentMethodsDiv">
        <button type="button" class="pay-method-btn" data-method="cod">💵 Cash on Delivery</button>
        <button type="button" class="pay-method-btn" data-method="credit">💳 Credit Card</button>
        <button type="button" class="pay-method-btn" data-method="gcash">📱 GCash</button>
        <button type="button" class="pay-method-btn" data-method="paymaya">🏦 PayMaya</button>
      </div>
      <input type="hidden" id="selectedPayment" value="cod">
    </div>
    <p style="margin: 1rem 0; font-weight: bold;">Total: <span id="checkoutTotalAmount">₱0.00</span></p>
    <button id="confirmOrderBtn" class="btn-checkout" style="width:100%">✅ Place Order</button>
    <button id="closeCheckoutBtn" class="close-modal" style="margin-top:10px;">Cancel</button>
  </div>
</div>

<script src="script.js"></script>
<footer> GreenLeaf Haven — Bringing Nature Closer to Home 🇵🇭</footer>
</body>
</html>
